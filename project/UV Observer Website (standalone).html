document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rint { display: none !important; }\n  a { color: #111111 !important; text-decoration: none !important; }\n  .uvo-shell { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }\n  .uvo-storypage { padding: 0 !important; }\n  .uvo-storygrid { display: block !important; width: 100% !important; max-width: 100% !important; }\n  .uvo-storymain { display: block !important; width: 100% !important; max-width: 100% !important; border-top: 3px solid #111111 !important; padding-top: 6pt !important; }\n  .uvo-storymain > * { margin: 0 0 5pt 0 !important; }\n  .uvo-printmast { max-width: 2.9in !important; }\n  .uvo-storymain h1, .uvo-storymain h2 { font-size: 21pt !important; line-height: 1.04 !important; }\n  .uvo-printimg { width: 100% !important; max-width: 100% !important; aspect-ratio: auto !important; height: 4.6in !important; background-size: contain !important; background-position: top center !important; }\n}\n@keyframes uvo-ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:var(--surface-page);min-height:100%;font-family:var(--font-body);\">\n<div class=\"uvo-noprint\" style=\"border-bottom:1px solid var(--hairline);background:var(--surface-sunken);overflow:hidden;\">\n<div style=\"max-width:var(--max-content-width);margin:0 auto;display:flex;align-items:center;gap:14px;\">\n<div style=\"flex:none;background:var(--brand-primary);color:#FFFFFF;font-family:var(--font-display);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:var(--tracking-kicker);padding:7px 12px;\">Microfiche<\u002Fdiv>\n<div style=\"flex:1;min-width:0;overflow:hidden;\">\n<div style=\"display:flex;width:max-content;animation:uvo-ticker 90s linear infinite;\" style-hover=\"animation-play-state:paused;\">\n<sc-for list=\"{{ tickerLoop }}\" as=\"t\" hint-placeholder-count=\"12\">\n<button class=\"uvo-navbtn\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"flex:none;fo owners Association was marched through the common area to their death by condo owners.'},\n  {town:'West Lebanon',edition:'April 1, 2023',text:'The tunnel to White River Jct. was blocked for hours when the driver of an oversized leaf-peeping SUV got their ski-rack stuck in the overhead EZ Pass reader.'},\n  {town:'Lyme',edition:'April 1, 2023',text:'No racially motivated crimes were reported due to the statistical realities of Lyme.'},\n];\n\nconst FORUM = [\n  {title:'Town Council should do what works for me, not the decision they\\u2019ve made following careful analysis of the issue',text:'While giving a cursory read of a recent article about an issue I sort of understand I was shocked that our volunteer civic leaders are prepared to vote in favor of a solution that doesn\\u2019t match my partially-informed knee-jerk reaction. Shame on them! As a life-long resident of this town, my half-baked opinion should matter more than those who have willingly invested their time analyzing this issue.',sig:'John Sanderson, Canaan'},\n  {title:'Only my house should be allowed in this town',text:'This neighborhood is not big enough for more than one house, and since I already live in it, no one else should be allowed to build near here.',sig:'Anne Marie Bastrop, Canaan'},\n  {title:'Please vote for the candidate who talked me into writing this',text:'I urge all citizens of this town to vote for the candidate who cornered me at a dinner party last weekend to ask me to write this Letter to the Editor on their behalf. I already told them that they have my vote, but they\\u2019ve asked me to publicly parade my support for them like I\\u2019m some sort of community influencer.',sig:'Adam Nelson, Canaan'},\n  {title:'I\\u2019m an uninformed nutjob, and you have to print this letter',text:'I\\u2019m a political wackadoodle who submits batshit crazy and conspiratorial letters each week based on widely disproven theories trumpeted to me by cable news, Facebook, and my uncle Doug. And you have to read them alongside the well researched and written letters because this is America and I have found a loophole in the public discourse.',sig:'Bill Thompson, Canaan'},\n  {title:'Vladamir Putin probably reads a lot of regional newspapers and this letter is going to change his mind',text:'The intractable international political conflict I\\u2019m writing about is very troubling, and I must voice my opinion and suggest a potential solution (that experts have likely already considered and rejected) by submitting it here: the Forum section of a regional New England newspaper with a circulation of under 20,000 readers. Surely during his review of local periodicals, this 85 word observation will finally move the needle.',sig:'Betty Sherry, Canaan'},\n];\n\nconst OPINION = [\n  {kicker:'Editorial',title:'Everything Is Going Great, And I\\u2019m Sure Everyone Is Trying Their Best',byline:'by our visibly concussed Editorial Columnist',dek:'When I woke up this morning to a beautiful sunrise, I had to close the shades as I\\u2019m very light-sensitive since being kicked in the head by a 17-hand thoroughbred chestnut horse.'},\n  {kicker:'Economy Columnist',title:'I Pledge To Do Everything I Can To Address The Housing Crisis, Except Of Course Making It Easier To Build More Housing',byline:'Jonathan Doe \\u2014 Regional Employer',dek:'As a regional employer I know that the housing shortage is the number one concern facing our employees and my company\\u2019s ability to hire and grow.'},\n];\n\nclass Component extends DCLogic {\n  state = { page: 'home', tag: 'All', subscribed: false, sectionsOpen: false, query: '', sort: 'new', storyId: null, blotter: 0, blotterPaused: false, forum: 0, forumPaused: false };\n  blotterStep = (n) => this.setState(s => ({ blotter: (s.blotter + n + BLOTTER.length) % BLOTTER.length }));\n  forumStep = (n) => this.setState(s => ({ forum: (s.forum + n + FORUM.length) % FORUM.length }));\n  syncHash = () => {\n    const h = window.location.hash || '';\n    const m = /^#\\/story\\/(.+)$/.exec(h);\n    const a = /^#\\/archive(?:\\/([^?]*))?/.exec(h);\n    if (m) this.setState({ page: 'story', storyId: decodeURIComponent(m[1]), sectionsOpen: false });\n    else if (a) {\n      const tag = a[1] ? decodeURIComponent(a[1]) : null;\n      this.setState(s => ({ page: 'news', storyId: null, sectionsOpen: false, tag: tag || s.tag }));\n    }\n    else if (this.state.page !== 'home') this.setState({ page: 'home', storyId: null });\n  };\n  componentDidMount() {\n    this.syncHash();\n    window.addEventListener('hashchange', this.syncHash);\n    this.blotterTimer = setInterval(() => { if (!this.state.blotterPaused) this.blotterStep(1); }, 7000);\n    this.forumTimer = setInterval(() => { if (!this.state.forumPaused) this.forumStep(1); }, 9000);\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.syncHash); clearInterval(this.blotterTimer); clearInterval(this.forumTimer); }\n  relatedCache = {};\n  relatedFor(id) {\n    if (!this.relatedCache[id]) {\n      const pool = ARCHIVE.filter(s => s.id !== id && s.photo);\n      for (let i = pool.length - 1; i > 0; i--) {\n        const j = Math.floor(Math.random() * (i + 1));\n        const t = pool[i]; pool[i] = pool[j]; pool[j] = t;\n      }\n      this.relatedCache[id] = pool.slice(0, 10);\n    }\n    return this.relatedCache[id];\n  }\n  relatedRef = React.createRef();\n  openStory = (id) => {\n    window.location.hash = '#/story/' + encodeURIComponent(id);\n    this.setState({ page: 'story', storyId: id, sectionsOpen: false });\n    window.scrollTo(0, 0);\n  };\n  tickerLoop = (() => { const t = DEEP_CUTS.slice().sort(()=>Math.random()-0.5).slice(0,14); return t.concat(t); })();\n  depthRef = React.createRef();\n  cityRef = React.createRef();\n\n  navStyle(active){\n    return active\n      ? { fontSize:'12px', fontWeight: 800, color:'#FFFFFF', background:'var(--brand-primary)' }\n      : { fontSize:'12px', fontWeight: 800, color:'var(--brand-secondary)', background:'transparent' };\n  }\n\n  renderVals(){\n    const page = this.state.page;\n    const tag = this.state.tag;\n    const goHome = () => { if (window.location.hash) window.location.hash = ''; this.setState({ page: 'home', storyId: null }); };\n    const setHash = (h) => { if ((window.location.hash || '') !== h) window.location.hash = h; };\n    const goNews = () => { setHash('#/archive'); this.setState({ page: 'news', storyId: null }); };\n    const goShop = () => { setHash(''); this.setState({ page: 'shop', storyId: null }); };\n    const goAbout = () => { setHash(''); this.setState({ page: 'about', storyId: null }); };\n    const onTagClick = (t) => { setHash('#/archive/' + encodeURIComponent(t)); this.setState({ page: 'news', tag: t, storyId: null, sectionsOpen: false }); };\n    const tagStyleFor = (t) => ({ color: t===tag ? 'var(--brand-primary)' : 'var(--text-muted)' });\n    const toggleSections = () => this.setState(s => ({ sectionsOpen: !s.sectionsOpen }));\n    const q = (this.state.query || '').trim().toLowerCase();\n    const sort = this.state.sort || 'new';\n    const archiveStories = ARCHIVE\n      .filter(s => (tag==='All' || s.tag===tag) && (!q || s.title.toLowerCase().includes(q)))\n      .slice()\n      .sort((a,b) => sort==='az' ? a.title.localeCompare(b.title) : (sort==='old' ? String(a.date).localeCompare(String(b.date)) : String(b.date).localeCompare(String(a.date))))\n      .map(s => ({ ...s,\n        hasNoPhoto: !s.photo,\n        onClick: () => this.openStory(s.id),\n        archiveStyle: s.photo ? { width:'100%', aspectRatio:String(s.ar||1), backgroundImage:`url(${s.photo})`, backgroundSize:'contain', backgroundRepeat:'no-repeat', backgroundPosition:'top center' } : null }));\n    const story = ARCHIVE.find(s => s.id === this.state.storyId) || ARCHIVE[0];\n    const relatedStories = this.relatedFor(story.id)\n      .map(s => ({ ...s,\n        onClick: () => this.openStory(s.id),\n        cardStyle: s.photo ? { width:'100%', aspectRatio:String(s.ar||1.66), backgroundImage:`url(${s.photo})`, backgroundSize:'cover', backgroundPosition:'top center' } : null }));\n    const tagCounts = ARCHIVE_TAGS.map(name => ({\n      name,\n      count: name==='All' ? ARCHIVE.length : ARCHIVE.filter(s => s.tag===name).length,\n      style: { color: name===tag ? 'var(--brand-primary)' : 'var(--text-headline)' },\n      onClick: () => onTagClick(name),\n    }));\n    const tagMenu = ARCHIVE_TAGS.map(name => ({\n      name,\n      style: { color: name===tag ? 'var(--brand-primary)' : 'var(--ink-700)', textAlign:'left', padding:'6px 16px' },\n      onClick: () => onTagClick(name),\n    }));\n    const sortOptions = [{key:'new',label:'Newest'},{key:'old',label:'Oldest'},{key:'az',label:'A–Z'}].map(o => ({\n      ...o,\n      onClick: () => this.setState({ sort: o.key }),\n      style: o.key===sort\n        ? { background:'var(--brand-secondary)', color:'#FFFFFF' }\n        : { background:'transparent', color:'var(--brand-secondary)' },\n    }));\n    return {\n      isHome: page==='home', isNews: page==='news', isShop: page==='shop', isAbout: page==='about', isStory: page==='story',\n      story: { ...story,\n        shareUrl: 'uvobserver.com/#/story/' + story.id,\n        leadImageStyle: story.srcImage ? { width:'100%', aspectRatio:String(SRC_AR[story.id] || 0.8), backgroundImage:`url(${story.srcImage})`, backgroundSize:'contain', backgroundRepeat:'no-repeat', backgroundPosition:'top center' } : null },\n      relatedStories,\n      printStory: () => window.print(),\n      relatedRef: this.relatedRef,\n      scrollRelatedLeft: () => { if (this.relatedRef.current) this.relatedRef.current.scrollBy({left:-480,behavior:'smooth'}); },\n      scrollRelatedRight: () => { if (this.relatedRef.current) this.relatedRef.current.scrollBy({left:480,behavior:'smooth'}); },\n      storeSidebar: PRODUCTS.slice(0,2).map(p => ({ ...p, sidebarSlotId: p.slotId + '-featured' })),\n      goHome, goNews, goShop, goAbout, onTagClick, tagStyleFor, toggleSections,\n      navStyleHome: this.navStyle(page==='home'), navStyleNews: this.navStyle(page==='news'),\n      navStyleShop: this.navStyle(page==='shop'), navStyleAbout: this.navStyle(page==='about'),\n      navStyleSections: this.navStyle(page==='news' || this.state.sectionsOpen),\n      sectionsOpen: this.state.sectionsOpen,\n      tags: ARCHIVE_TAGS, tagMenu, activeTag: tag,\n      leadStory: { ...HOME_STORIES[0], onClick: () => this.openStory(HOME_STORIES[0].id) },\n      shopModuleStyle: { display:'flex', flexDirection:'column' },\n      leadPhotoStyle: { width:'46%', flex:'none', alignSelf:'stretch', minHeight:'300px', backgroundImage:`url(${HOME_STORIES[0].photo})`, backgroundSize:'cover', backgroundPosition:'top center' },\n      recentStories: HOME_STORIES.slice(1,4).map(s => ({ ...s, onClick: () => this.openStory(s.id) })),\n      moreStories: HOME_STORIES.slice(4,10),\n      inDepth: IN_DEPTH,\n      cityLongform: CITY_LONGFORM,\n      cityBriefs: CITY_BRIEFS,\n      inFocus: IN_FOCUS,\n      cityRef: this.cityRef,\n      scrollCityLeft: () => { if (this.cityRef.current) this.cityRef.current.scrollBy({left:-540,behavior:'smooth'}); },\n      scrollCityRight: () => { if (this.cityRef.current) this.cityRef.current.scrollBy({left:540,behavior:'smooth'}); },\n      topicColumns: TOPIC_COLUMNS.map(c => ({ ...c, items: c.items.map(s => ({ ...s, onClick: () => this.openStory(s.id) })) })),\n      tickerLoop: this.tickerLoop.map(t => ({ ...t, onClick: () => this.openStory(t.id) })),\n      depthRef: this.depthRef,\n      scrollDepthLeft: () => { if (this.depthRef.current) this.depthRef.current.scrollBy({left:-540,behavior:'smooth'}); },\n      scrollDepthRight: () => { if (this.depthRef.current) this.depthRef.current.scrollBy({left:540,behavior:'smooth'}); },\n      mostRead: MOST_READ.map(s => ({ ...s, onClick: () => this.openStory(s.id) })),\n      igPosts: IG_POSTS.slice(0,3),\n      blotter: BLOTTER[this.state.blotter],\n      blotterNo: String(this.state.blotter + 1).padStart(2,'0'),\n      blotterTotal: BLOTTER.length,\n      blotterPrev: () => this.blotterStep(-1),\n      blotterNext: () => this.blotterStep(1),\n      blotterHold: () => this.setState({ blotterPaused: true }),\n      blotterRelease: () => this.setState({ blotterPaused: false }),\n      opinion: OPINION,\n      forum: FORUM[this.state.forum],\n      forumNo: String(this.state.forum + 1).padStart(2,'0'),\n      forumTotal: FORUM.length,\n      forumPrev: () => this.forumStep(-1),\n      forumNext: () => this.forumStep(1),\n      forumHold: () => this.setState({ forumPaused: true }),\n      forumRelease: () => this.setState({ forumPaused: false }),\n      forumDots: FORUM.map((b,i) => ({\n        onClick: () => this.setState({ forum: i }),\n        style: { width:'6px', height:'6px', border:'1px solid #5B3E8E', background: i === this.state.forum ? '#5B3E8E' : 'transparent', padding:0, cursor:'pointer' },\n      })),\n      blotterDots: BLOTTER.map((b,i) => ({\n        onClick: () => this.setState({ blotter: i }),\n        style: { width:'5px', height:'5px', border:'1px solid var(--brand-secondary)', background: i === this.state.blotter ? 'var(--brand-secondary)' : 'transparent', padding:0, cursor:'pointer', flex:'none' },\n      })),\n      products: PRODUCTS,\n      featuredProducts: PRODUCTS.slice(0,2).map(p => ({ ...p, featuredSlotId: p.slotId + '-featured' })),\n      archiveStories, tagCounts, sortOptions,\n      noResults: archiveStories.length === 0,\n      onSort: (k) => this.setState({ sort: k }),\n      query: this.state.query || '',\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      resultCount: archiveStories.length + (archiveStories.length===1 ? ' story' : ' stories'),\n      tagChipStyleFor: (t) => ({ color: t===tag ? 'var(--brand-primary)' : 'var(--text-muted)', textDecoration: t===tag ? 'underline' : 'none' }),\n      subscribed: this.state.subscribed,\n      notSubscribed: !this.state.sub
