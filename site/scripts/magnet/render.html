<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>UVO Magnet Render</title>
<meta name="viewport" content="width=975">
<!-- League Gothic is loaded locally (scripts/magnet/league-gothic.woff2) so renders don't depend on Google Fonts. -->
<!--
  UV Observer 3x3 headline magnet renderer.
  Output: 975 x 975 px = 3.25 in square at 300 dpi (3 in finished + 0.125 in bleed per side).
  Masthead: the uvobserver.com header image (UVO logo subhead.png), cropped and embedded below.

  Get the fields from any post: https://www.uvobserver.com/news/<id>?format=json
    item.title      -> headline
    item.publishOn  -> date (ms timestamp; convert to YYYY-MM-DD in America/New_York)
    item.assetUrl   -> photo (the post's main image)

  URL parameters:
    headline  (required)  the headline
    date      YYYY-MM-DD for the dateline under the masthead
    photo     (required)  absolute URL of the main image
    focus     0-100, vertical crop position of the image (default 50 = centered)
    day       optional override for the weekday text
    logo      optional override: URL of a different masthead image
    readmore  1 = no photo (text-only post): show a red "Read More…" button in the photo area

  Or call window.renderMagnet(document.getElementById("mag"), {headline, date, photo, focus, logo}).
  Screenshot once window.magnetReady === true, clipped to 0,0,975,975.
-->
<style>
@font-face{font-family:'League Gothic';src:url('./league-gothic.woff2') format('woff2');font-weight:400;font-style:normal;}
html,body{margin:0;padding:0;width:975px;height:975px;overflow:hidden;background:#ffffff}
.mag{position:relative;width:975px;height:975px;background:#ffffff;color:#222222;overflow:hidden;font-family:'League Gothic','Oswald','Arial Narrow',sans-serif;transform-origin:0 0}
.mag .safe{position:absolute;inset:75px;display:flex;flex-direction:column}
.mag .hed-box{flex:none;margin-top:14px;padding-top:14px;border-top:3px solid #222222;box-sizing:content-box;overflow:hidden}
.mag .hed{margin:0;font-weight:400;line-height:.98;letter-spacing:.01em;text-transform:capitalize;color:#222222;text-wrap:balance;overflow-wrap:break-word}
.mag .photo{flex:1;min-height:0;margin:16px 0 0;overflow:hidden;background:#e4e4e4;position:relative}
.mag .photo img{display:block;width:100%;height:100%;object-fit:cover}
.mag .photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;letter-spacing:.08em;text-transform:uppercase;color:#8a8a8a}
.mag .photo img[src]+.ph{display:none}
.mag .logo{flex:none;display:block;width:100%;height:auto}
.mag .logo-ph{flex:none;height:230px;border:3px dashed #b0b0b0;display:flex;align-items:center;justify-content:center;font-size:40px;letter-spacing:.08em;text-transform:uppercase;color:#8a8a8a;text-align:center}
.mag .logo[src]+.logo-ph{display:none}
.mag .logo:not([src]){display:none}
.mag .photo .more{display:none}
.mag .photo.readmore{background:#ffffff;display:flex;align-items:center;justify-content:center}
.mag .photo.readmore img,.mag .photo.readmore .ph{display:none}
.mag .photo.readmore .more{display:inline-flex;align-items:center;gap:22px;background:#b61b1b;color:#ffffff;font-size:88px;line-height:1;letter-spacing:.04em;text-transform:uppercase;padding:30px 58px 30px 62px;box-shadow:inset 0 0 0 6px #b61b1b,inset 0 0 0 10px #ffffff;border-radius:6px}
.mag .photo.readmore .more .arr{font-size:72px}
.mag .dateline{flex:none;margin-top:14px;padding:8px 0 0;border-top:3px solid #222222;display:flex;justify-content:space-between;align-items:baseline;text-transform:uppercase;letter-spacing:.07em;font-size:28px;line-height:1;color:#222222;white-space:nowrap}
.mag .dateline .url{color:#b61b1b}

</style></head>
<body>
<div class="mag" id="mag"></div>
<script>
const MAG_HTML = `<div class="safe">
  <img class="logo" alt="The UV Observer"><div class="logo-ph">Website masthead</div>
  <div class="hed-box"><h1 class="hed"></h1></div>
  <figure class="photo"><img alt=""><span class="ph">Main image</span><span class="more">Read More… <span class="arr">&rarr;</span></span></figure>
  <div class="dateline"><span class="dl-date"></span><span class="url">uvobserver.com</span></div>
</div>`;
function magParse(iso){ const [y,m,d]=String(iso||'').split('-').map(Number); return (y&&m&&d)?new Date(y,m-1,d):null; }
function magDay(iso){ const t=magParse(iso); return t?t.toLocaleDateString('en-US',{weekday:'long'}):''; }
function magDate(iso){ const t=magParse(iso); return t?t.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):''; }
function renderMagnet(root, d){
  if(!root.querySelector('.safe')) root.insertAdjacentHTML('afterbegin', MAG_HTML);
  const q=s=>root.querySelector(s);
  const logo=q('.logo'); if(d.logo){ if(logo.getAttribute('src')!==d.logo) logo.src=d.logo; } else logo.removeAttribute('src');
  const day=d.day||magDay(d.date), dt=magDate(d.date);
  q('.dl-date').textContent=[day,dt].filter(Boolean).join(', ');
  q('.hed').textContent = d.headline || '';
  const safe=q('.safe'), W=safe.clientWidth;
  // headline gets up to 45% of what is left (60% with no photo); the photo area takes the rest
  const box=q('.hed-box'), hed=q('.hed'), fig=q('.photo'), img=q('.photo img');
  box.style.height='0px'; fig.style.flex='none'; fig.style.height='0px';
  const fixed=[...safe.children].filter(e=>e!==box&&e!==fig).reduce((a,e)=>a+e.offsetHeight,0);
  const room=safe.clientHeight-fixed-14-17-16-14; const maxH=Math.round(room*(d.readmore?0.6:0.45));  // text-only magnets give the headline more room
  box.style.height=maxH+'px';
  let lo=40, hi=200; while(hi-lo>1){ const m=(lo+hi)>>1; hed.style.fontSize=m+'px'; if(hed.scrollHeight<=maxH && hed.scrollWidth<=W) lo=m; else hi=m; }
  hed.style.fontSize=lo+'px'; box.style.height=hed.scrollHeight+'px';
  fig.style.flex=''; fig.style.height='';
  fig.classList.toggle('readmore', !!d.readmore);
  if(d.photo && !d.readmore){ if(img.getAttribute('src')!==d.photo) img.src=d.photo; } else img.removeAttribute('src');
  img.style.objectPosition = `50% ${d.focus==null||d.focus===''?50:d.focus}%`;
}
